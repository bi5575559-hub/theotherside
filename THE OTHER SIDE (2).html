<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE OTHER SIDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0b0710;--purple:#2a1340;--orange:#e8731a;--gold:#c9a227;--text:#eadff0;--muted:#a995b8;--red:#c4262e;
  --card:rgba(20,10,32,.78);--line:rgba(201,162,39,.35);
  --serif:"Gowun Batang","Noto Serif KR","Batang",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.75;
  background:linear-gradient(180deg,var(--purple) 0%,var(--black) 78%) fixed,var(--black)}
body::after{content:"";position:fixed;inset:auto 0 0 0;height:30%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 120%,rgba(120,80,160,.28),transparent 70%)}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:22px 20px 48px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--serif);margin:0}
.title{font-size:clamp(34px,10vw,46px);color:var(--gold);letter-spacing:.04em;text-align:center;line-height:1.15}
.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 18px;margin:14px 0}
.card h3{color:var(--gold);font-size:18px;margin-bottom:6px}
.card p{margin:0 0 10px}.card p:last-child{margin-bottom:0}
.btn{display:block;width:100%;min-height:52px;padding:12px 16px;margin:10px 0;background:transparent;color:var(--text);
  border:1px solid var(--gold);border-radius:4px;font:500 16px var(--sans);text-align:center;cursor:pointer;text-decoration:none}
.btn:hover,.btn:active{background:rgba(201,162,39,.14)}
.btn.main{background:var(--gold);color:#1a1000;font-weight:700}
.small{font-size:13px;color:var(--muted)}
.back{background:none;border:0;color:var(--muted);font:14px var(--sans);padding:8px 0;cursor:pointer}
.warn{color:var(--red);font-weight:700;font-size:26px;font-family:var(--serif);text-align:center;margin:26px 0;border:2px solid var(--red);padding:18px;border-radius:4px;animation:shake .5s 1}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.q{font-family:var(--serif);font-size:28px;text-align:center;line-height:1.4;margin:44px 0 28px}
input{width:100%;min-height:50px;margin:6px 0 14px;padding:10px 12px;background:rgba(0,0,0,.4);color:var(--text);border:1px solid var(--line);border-radius:4px;font:16px var(--sans)}
label{font-size:14px;color:var(--muted)}
.err{color:#ff8a8a;font-size:14px;min-height:1.4em;margin:0}
.dots::after{content:"";animation:d 1.2s steps(4) infinite}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.art{display:block;margin:6px auto 8px;width:170px}
.flame{transform-origin:50% 100%;animation:fl 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:scale(1,1)}30%{transform:scale(.94,1.06)}60%{transform:scale(1.04,.96)}}
.deco{display:flex;justify-content:center;gap:18px;margin:8px 0 2px;opacity:.9}
.hidden{margin-top:36px;text-align:center;font-size:11px;color:var(--muted);opacity:.4}
.table{width:100%;border-collapse:collapse;font-size:15px}
.table td{padding:8px 0;border-bottom:1px solid rgba(201,162,39,.2);vertical-align:top}
.table td:first-child{width:5.5em;color:var(--gold)}
ol.rules{padding-left:1.3em;margin:0}ol.rules li{margin-bottom:12px}
.pen{display:block;font-size:13px;color:var(--orange)}
details{border-bottom:1px solid rgba(201,162,39,.2);padding:10px 0}summary{cursor:pointer;font-weight:500}
details p{margin:8px 0 0;color:var(--muted)}
.post{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(201,162,39,.2);color:var(--text);font:16px var(--sans);padding:12px 0;cursor:pointer}
.post b{display:block}.post span{font-size:13px;color:var(--muted)}
.pin{color:var(--orange);font-size:13px}
@media (prefers-reduced-motion:reduce){.flame,.warn,.dots::after{animation:none}}
.ov{position:fixed;inset:0;z-index:9;background:var(--black);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.ov p{font-family:var(--serif);color:var(--gold);font-size:22px;margin:0}
.btn{color:#fff}
.hero,.place img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border:1px solid var(--gold);border-radius:4px}
.hero{margin:12px 0 14px}
.place img{margin:8px 0 12px}
.cm{padding:8px 0;border-top:1px solid rgba(201,162,39,.2);font-size:15px}
.cm b{color:var(--gold);font-weight:500;margin-right:8px}
.cmh{font-size:14px;color:var(--muted);margin:0 0 4px}
.cm.re{margin-left:18px;font-size:14px;color:var(--muted)}
.dt{display:flex;align-items:center;gap:6px}
.dt input{width:auto;min-width:0;flex:1;text-align:center;margin:6px 0 14px}
.dt #yy{flex:1.7}
.dt span{color:var(--muted)}
.sign{text-align:right;color:var(--muted);font-size:14px;margin-top:14px}
.chap{font-family:var(--serif);color:#fff;font-size:20px;margin:26px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--gold)}
.at{color:var(--gold);font-size:16px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov" class="ov" aria-hidden="true"><p>저승에 연결하는 중<span class="dots"></span></p></div>
<script>
var app=document.getElementById('app'),mem=null,timer=null;
function setName(n){try{sessionStorage.setItem('os_name',n)}catch(e){}mem=n}
function getName(){try{var v=sessionStorage.getItem('os_name');if(v!==null)return v}catch(e){}return mem}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function go(h){location.hash=h}

var C={
 intro:'본 연회는 생존자의 참석을 허용하지 않습니다.<br>이미 입장하셨다면 가까운 행사 담당자에게 문의해 주십시오.',
 overview:['망자 여러분, 그간 평안하셨습니까?','저승의 긴 밤을 보내고 계신 망자 여러분을 위해 올해도 어김없이 특별한 축제가 마련되었습니다.','생전의 신분도, 사후에 남겨진 원한도 잠시 내려놓으시길 바랍니다. 오늘 밤만큼은 누구나 동등한 초대객이며 누구나 축제를 즐길 자격이 있습니다.','부디 오늘 밤만큼은 지난날의 모든 것을 잊고, 이곳에서만 허락되는 평온을 만끽하시길 바랍니다.','망자 여러분의 영원한 안식을 기원하며, 즐거운 밤 되십시오.'],
 info:[['행사 일정','10월 31일 00:00 ~ 11월 1일 00:00'],['참여 대상','초대장을 받은 망자'],['주최','저승 행정기관'],['귀가 안내','자정이 지나기 전에 귀가 절차를 마쳐 주시기 바랍니다.']],
 hall:['저희 저승 행정기관은 망자 여러분의 평온한 사후 생활과 교류를 도모하고자 매년 10월 31일 특별 연회를 개최합니다.','본 연회는 생전의 신분과 지위, 사후에 남겨진 원한과 이해관계를 잠시 내려놓고 모든 망자가 동등한 초대객으로서 한자리에 모이는 특별 행사입니다.','연회는 10월 31일 00시부터 11월 1일 00시까지 할로우 하우스(HOLLOW HOUSE)에서 진행됩니다.','행사 기간 동안 연회장 내에 마련된 음식과 음료를 자유롭게 이용하실 수 있으며 다양한 공간에서 휴식과 교류를 즐기실 수 있습니다.','참석자 여러분께서는 원활한 행사 진행을 위하여 별도로 공지된 연회 규정을 숙지하여 주시기 바랍니다. 11월 1일 00시, 종료를 알리는 종소리가 울리면 연회는 공식적으로 종료됩니다. 행사가 종료되면 참석자 여러분께서는 안내에 따라 지정된 귀환 절차를 이행하여 주시기 바랍니다.','저승행정기관은 모든 참석자의 평온하고 안전한 귀환을 기원합니다. 감사합니다.'],
 places:[
  ['01. 현관','gate',['현관 한쪽에는 참석자의 신원을 확인하기 위한 접수대가 마련되어 있습니다. 담당 저승사자가 이곳에서 초대장을 확인한 후 저승의 공식 명부를 기준으로 참석자의 신원을 조회합니다. 확인 절차를 마친 참석자는 연회장 및 기타 공개 구역으로 이동할 수 있습니다.']],
  ['02. 연회장','hall',['연회장 중앙에는 참석자들이 자유롭게 어울릴 수 있도록 넓은 공간이 마련되어 있습니다. 한쪽에는 현악 연주를 위한 소규모 무대가, 다른 한쪽에는 다양한 음식과 음료가 준비된 긴 테이블이 배치되어 있습니다. 곳곳에 놓인 소파와 원형 테이블은 참석자들이 담소를 나누거나 휴식을 취할 수 있도록 구성되어 있습니다.']],
  ['03. 식당','dine',['식당은 망자 여러분들이 음식과 음료를 자유롭게 이용할 수 있도록 마련된 공간입니다. 제공되는 음식은 생전의 식사를 재현하기 위한 것으로 맛과 향, 식감은 살아 있을 때의 감각을 떠올릴 수 있을 만큼 생생하게 구현됩니다. 좌석은 별도로 지정되지 않으니 원하는 자리에 앉아 식사하거나 다른 망자들과 대화를 나눌 수 있습니다.','본 공간은 망자들이 생전의 평범한 일상과 소소한 행복을 잠시나마 되새길 수 있도록 마련되었습니다.']],
  ['04. 응접실','parlor',['응접실은 연회장에서 떨어진 복도 안쪽에 자리한 휴식 공간입니다. 연회장의 소란에서 벗어나 조용히 대화를 나누거나 휴식을 취하실 수 있습니다.']],
  ['05. 정원','garden',['정원은 모든 참석자가 자유롭게 이용할 수 있는 공용 공간입니다. 연회장의 소란에서 벗어나 바깥 공기를 느끼며 휴식을 취하고 싶은 참석자에게 권장됩니다.']]
 ],
 rulesIntro:'저승행정기관 연회 운영부는 원활한 행사 진행과 참석자 간의 질서 유지를 위하여 다음과 같이 연회 참석자 준수 사항을 공고합니다. 모든 참석자는 아래 규정을 숙지하고 준수하여 주시기 바랍니다.',
 rules:[
  ['제1장. 참석 및 질서 유지',[
   ['제1조. 초대장 소지 및 신원 확인','모든 참석자는 발급받은 초대장을 반드시 소지하여야 합니다. 신원은 저승의 공식 명부를 기준으로 조회하며, 명부에 등록되지 않은 영혼은 별도의 확인 절차를 거칠 수 있습니다.',''],
   ['제2조. 사적 정보에 대한 존중','다른 참석자의 생전 신분, 사망 경위 및 사후의 사정을 끈질기거나 무례하게 추궁하여서는 안 됩니다. 상대방의 동의하에 이루어지는 질문은 허용되나, 명확한 거부 의사를 밝혔음에도 추궁을 지속하는 경우 처분이 적용됩니다.','영혼소멸'],
   ['제3조. 영혼에 대한 위해 행위 금지','연회장 내에서 허가되지 않은 영혼의 흡수, 포획 및 훼손 행위를 엄격히 금지합니다. 위반 사실이 확인될 경우 처분이 적용됩니다.','영혼소멸'],
   ['제4조. 참석자에 대한 모욕 및 위협 금지','다른 참석자의 외형이나 능력을 이유로 조롱하거나 위협하는 행위를 금지합니다. 위반 사실이 확인될 경우 처분이 적용될 수 있습니다.','연회 퇴장 및 영혼귀속'],
   ['제5조. 출입 제한 구역 준수','저택 관리자의 사전 허가 없이 출입이 제한된 구역에 진입하여서는 안 됩니다. 위반 사실이 확인될 경우 처분이 적용됩니다.','영혼귀속']]],
  ['제2장. 분쟁 및 초대장 관리',[
   ['제6조. 분쟁 발생 시 신고 의무','분쟁이 발생한 경우 임의로 해결하려 하지 말고 담당 저승사자에게 즉시 신고하여야 합니다. 접수된 분쟁은 염라법 제4조 「연회특별법」에 따라 판결되며, 담당자의 승인 없는 사적 제재는 별도의 위반 사항으로 간주될 수 있습니다.',''],
   ['제7조. 초대장 양도 및 위조 금지','타인의 초대장을 무단으로 양도하거나 초대장을 위조·변조하는 행위를 금지합니다. 위반 사실이 확인될 경우 처분이 적용됩니다.','영혼소멸']]],
  ['제3장. 시설 이용 및 행사 종료',[
   ['제8조. 연회 시설 및 비품 관리','연회장과 저택 내 시설 및 비품을 소중히 이용하여야 합니다. 고의로 훼손한 경우 손해 규모와 위반 경위에 따라 처분이 부과될 수 있습니다.','사후 행정 처분'],
   ['제9조. 연회 종료 및 귀환 절차','11월 1일 00시, 종료를 알리는 종소리가 울리면 모든 참석자는 진행 중인 활동을 중단하고 지정된 귀환 절차에 따라야 합니다. 귀환을 거부하거나 정당한 사유 없이 불응하는 경우 처분이 적용됩니다.','강제이동 및 영혼귀속']]],
  ['제4장. 처분 및 행정 절차',[
   ['제10조. 처분의 종류','1. 영혼소멸: 존재 자체를 완전히 소멸시키는 처분입니다. 환생, 귀환, 복구가 모두 불가능하며 어떠한 사유로도 취소하거나 번복할 수 없습니다.<br>2. 영혼귀속: 자유 의지와 이동 권한을 박탈하고 저승의 관리 체계에 영구적으로 귀속시킵니다.<br>3. 강제이동: 영혼의 의사와 관계없이 지정된 장소로 강제 이송합니다.<br>4. 연회 퇴장: 참석 자격을 박탈하고 저택 외부로 추방하며, 재입장할 수 없습니다.<br>5. 사후 행정 처분: 시설·비품 훼손 등의 손해에 대해 사후 재산 압류, 노역 부과 등을 적용합니다.',''],
   ['제11조. 처분에 대한 이의 신청','모든 참석자는 부과된 처분에 대하여 이의를 신청할 수 있으며, 담당 부서의 정해진 절차에 따라 접수 및 검토됩니다. (단, 영혼소멸 처분이 집행된 이후에는 신청인의 존재 여부를 확인할 수 없으므로 접수가 불가능합니다.)',''],
   ['제12조. 처분의 중복 적용 및 결정 권한','하나의 위반 행위에 복수의 처분이 적용될 수 있습니다. 처분의 종류와 수위는 위반의 정도 및 사후 질서에 미치는 영향을 고려하여 결정되며, 최종 결정 권한은 담당 저승사자에게 있습니다.',''],
   ['제13조. 처분 집행의 원칙','저승사자는 어떠한 경우에도 오판하지 않습니다. 모든 처분은 위반 사실과 대상의 신원이 명확히 확인된 경우에 한하여 집행되며, 확증 없는 추정만을 근거로 처분을 부과하는 행위는 엄격히 금지됩니다.','']]]

function sub(title,body,bk){bk=bk||['/main','메인으로'];return '<button class="back" data-go="'+bk[0]+'">← '+bk[1]+'</button><h2 class="center" style="color:var(--gold);font-size:26px;margin:4px 0 8px">'+title+'</h2>'+body}

function authView(step,msg){
  if(step==='ask')return '<p class="q">귀하는 현재<br>사망한 상태입니까?</p><button class="btn main" data-act="yes">예, 저는 망자입니다.</button><button class="btn" data-act="no">아니요, 저는 살아있습니다.</button><p class="small center" style="margin-top:22px">※ 허위 기재로 발생하는 사후 행정상의 불이익은 본 기관에서 책임지지 않습니다.</p>';
  if(step==='form')return '<h2 class="center" style="margin:40px 0 18px;color:var(--gold)">망자 확인 양식</h2><div class="card"><p class="small" style="margin-top:0">저승 명부 대조를 위해 아래 항목을 양식에 맞게 기재해 주십시오.<br>※ 사망일자는 숫자만 기재 (예: 1892 년 11 월 3 일)</p><label for="nm">성명</label><input id="nm" autocomplete="off" maxlength="20" placeholder="예: 홍길동"><label>사망일자</label><div class="dt"><input id="yy" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="년"><span>년</span><input id="mm" inputmode="numeric" maxlength="2" placeholder="00" aria-label="월"><span>월</span><input id="dd" inputmode="numeric" maxlength="2" placeholder="00" aria-label="일"><span>일</span></div><p class="err" id="er">'+(msg||'')+'</p><button class="btn main" data-act="verify">제출</button></div><button class="back" data-act="ask">← 처음으로</button>';
  if(step==='check')return '<p class="q" style="margin-top:90px">저승 명부 대조 중<span class="dots"></span></p>';
  if(step==='no1')return '<p class="q" style="margin-top:90px">죄송합니다.<br>사이트 연결이 원활하지 않습니다.</p>';
  return '<div class="warn" role="alert" style="margin-top:80px">접근 권한이<br>없습니다.</div><button class="btn" data-act="ask">다시 시도</button>';
}
function mainView(){
  var n=getName();
  return '<p class="small center" style="margin:0 0 6px">'+esc(n)+' 망자님, 입장이 확인되었습니다.</p>'+
   '<div class="deco">'+bat+pumpkin+bat+'</div><h1 class="title">THE OTHER<br>SIDE</h1>'+
   '<img class="hero" src="'+IMG.main+'" alt="촛불과 해골, 호박으로 장식된 검은 케이크">'+
   '<p class="center" style="margin:0 0 18px">'+C.intro+'</p>'+
   [['/info','행사 안내'],['/hall','연회장 둘러보기'],['/rules','규칙 안내'],['/board','게시판'],['/faq','자주 묻는 질문'],['/contact','문의하기']].map(function(m){return '<button class="btn" data-go="'+m[0]+'">'+m[1]+'</button>'}).join('')+
   '<p class="hidden">이 페이지는 플롯 속 가상의 행사를 위해 만든 것입니다.</p>';
}
function table(rows){return '<table class="table">'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join('')+'</table>'}

function paras(a){return a.map(function(t){return '<p>'+t+'</p>'}).join('')}
function tag(t){return t.replace(/^(\[[^\]]+\])/,'<span class="pin">$1</span>')}
function render(){
  clearTimeout(timer);
  var r=location.hash.replace(/^#/,'')||'/';
  if(r!=='/'&&getName()===null){go('/');return}
  window.scrollTo(0,0);
  if(r==='/'){app.innerHTML=authView('ask');return}
  if(r==='/main'){app.innerHTML=mainView();return}
  if(r==='/info'){app.innerHTML=sub('행사 안내','<div class="card"><h3>행사 개요</h3>'+paras(C.overview)+'</div><div class="card">'+table(C.info)+'</div>');return}
  if(r==='/hall'){app.innerHTML=sub('연회장 둘러보기','<div class="card"><h3>연회 안내</h3>'+paras(C.hall)+'<p class="sign">저승행정기관 연회 운영부</p></div><button class="btn main" data-go="/places">장소 안내 보기</button>');return}
  if(r==='/places'){app.innerHTML=sub('장소 안내',C.places.map(function(p){return '<div class="card place"><h3>'+p[0]+'</h3><img src="'+IMG[p[1]]+'" alt="'+p[0]+'">'+paras(p[2])+'</div>'}).join(''),['/hall','연회장 둘러보기']);return}
  if(r==='/rules'){app.innerHTML=sub('규칙 안내','<div class="card"><h3>연회 참석자 준수 사항</h3><p>'+C.rulesIntro+'</p></div>'+C.rules.map(function(ch){return '<h3 class="chap">'+ch[0]+'</h3>'+ch[1].map(function(a){return '<div class="card"><h3 class="at">'+a[0]+'</h3><p>'+a[1]+'</p>'+(a[2]?'<span class="pen">처분: '+a[2]+'</span>':'')+'</div>'}).join('')}).join('')+'<div class="card" style="border-color:var(--red)"><p style="color:#ff8a8a">❗ '+C.rulesEnd+'</p></div><p class="sign">저승행정기관 연회 운영부<br>본 공고는 모든 연회 참석자에게 동일하게 적용됩니다.</p>');return}
  if(r==='/board'){app.innerHTML=sub('게시판','<div class="card" style="padding:6px 18px">'+C.board.map(function(p,i){return '<button class="post" data-go="/board/'+i+'"><b>'+tag(p.t)+'</b><span>'+p.w+' · '+p.d+' · 조회 '+p.v+(p.c?' · 댓글 '+p.c.length:'')+'</span></button>'}).join('')+'</div>');return}
  var m=r.match(/^\/board\/(\d+)$/);
  if(m&&C.board[+m[1]]){var p=C.board[+m[1]];app.innerHTML='<button class="back" data-go="/board">← 게시판으로</button><div class="card"><h3>'+tag(p.t)+'</h3><p class="small">작성자: '+p.w+'<br>등록일: '+p.d+'<br>조회수: '+p.v+'</p>'+paras(p.b)+'</div>'+(p.c?'<div class="card"><p class="cmh">댓글 '+p.c.length+'</p>'+p.c.map(function(c){return '<div class="cm'+(c[2]?' re':'')+'"><b>'+(c[2]?'ㄴ ':'')+c[0]+'</b>'+c[1]+'</div>'}).join('')+'</div>':'');return}
  if(r==='/faq'){app.innerHTML=sub('자주 묻는 질문','<div class="card">'+C.faq.map(function(f){return '<details><summary>Q. '+f[0]+'</summary><p>A. '+f[1]+'</p></details>'}).join('')+'</div>');return}
  if(r==='/contact'){app.innerHTML=sub('문의하기','<div class="card">'+table(C.contact)+'</div>');return}
  app.innerHTML=sub('안내','<div class="card"><p class="center">저승 행정 처리 중입니다.<br>잠시 후 다시 확인해 주십시오.</p></div>');
}

app.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-act]');if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return}
  var a=t.dataset.act;
  if(a==='ask'){clearTimeout(timer);app.innerHTML=authView('ask')}
  else if(a==='yes'){app.innerHTML=authView('form')}
  else if(a==='no'){app.innerHTML=authView('no1');timer=setTimeout(function(){app.innerHTML=authView('no2')},2000)}
  else if(a==='verify'){
    var n=document.getElementById('nm').value.trim(),y=document.getElementById('yy').value.trim(),mo=document.getElementById('mm').value.trim(),d=document.getElementById('dd').value.trim(),er=document.getElementById('er');
    if(!n||!y||!mo||!d){er.textContent='기재 사항이 누락되었습니다.';return}
    if(!/^\d{1,4}$/.test(y)||!/^\d{1,2}$/.test(mo)||!/^\d{1,2}$/.test(d)){er.textContent='기재 형식이 올바르지 않습니다. 숫자만 기재해 주십시오.';return}
    if(!/^[가-힣A-Za-z·\s]{1,20}$/.test(n)){er.textContent='성명 형식이 올바르지 않습니다. 한글 또는 영문으로 기재해 주십시오.';return}
    var Y=+y,M=+mo,D=+d,dt=new Date(2000,0,1);dt.setFullYear(Y,M-1,D);
    if(Y<1||Y>2026||M<1||M>12||D<1||dt.getFullYear()!==Y||dt.getMonth()!==M-1||dt.getDate()!==D){er.textContent='존재하지 않는 일자입니다. 사망일자를 양식에 맞게 다시 기재해 주십시오.';return}
    setName(n);app.innerHTML=authView('check');timer=setTimeout(function(){go('/main')},2000);
  }
});
var ov=document.getElementById('ov'),tt=null,first=true;
function nav(){
  var r=location.hash.replace(/^#/,'')||'/';
  clearTimeout(tt);
